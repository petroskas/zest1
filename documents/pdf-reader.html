<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Disability document reader | ZEST</title>
<style>
:root{color-scheme:light;--ink:#211d35;--purple:#4b2a9c;--line:#ddd8ee;--surface:#fff;--soft:#f5f2fb;--muted:#514b64}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--soft);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.reader{max-width:1000px;margin:0 auto}
h1{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.3;margin:0 0 6px}
.note{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.controls{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;background:#ffffffed;backdrop-filter:blur(8px)}
button,select{min-height:42px;padding:8px 14px;border:2px solid var(--purple);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit}
button{font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
select{max-width:100%}
:focus-visible{outline:3px solid #d99500;outline-offset:2px}
.page-shell{display:grid;place-items:start center;min-height:55vh;padding:14px;border:1px solid var(--line);border-radius:14px;background:#dedbe5;overflow:auto}
.page-image{display:block;max-width:none;height:auto;background:white;box-shadow:0 2px 12px #211d3525}
.status{min-height:1.6em;margin:10px 0 0;color:var(--muted);text-align:center}
.status[data-error="true"]{color:#a32222;font-weight:650}
@media(max-width:600px){body{padding:10px}.page-shell{padding:8px;min-height:45vh}.controls{gap:6px}button,select{padding:7px 10px}}
</style>
</head>
<body>
<main class="reader" id="reader">
  <h1 id="documentTitle">Loading document…</h1>
  <p class="note">View the original document one page at a time. Only the selected page is loaded.</p>
  <nav class="controls" aria-label="Document page and zoom controls">
    <button id="previousPage" type="button" disabled>Previous</button>
    <label for="pageSelect">Page</label>
    <select id="pageSelect" aria-label="Choose document page" disabled></select>
    <button id="nextPage" type="button" disabled>Next</button>
    <button id="zoomOut" type="button" aria-label="Zoom out" disabled>−</button>
    <button id="zoomIn" type="button" aria-label="Zoom in" disabled>+</button>
  </nav>
  <div class="page-shell" id="pageShell">
    <img class="page-image" id="pageImage" alt="Document page" draggable="false" hidden>
  </div>
  <p class="status" id="readerStatus" role="status" aria-live="polite">Loading the selected document…</p>
</main>
<script src="pdf-reader.js?v=20261110-3"></script>
</body>
</html>
